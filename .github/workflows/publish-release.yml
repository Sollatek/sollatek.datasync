name: Validate and publish DataSync release

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
      - 'candidate/v*.*.*'
      - 'release/v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datasync-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/sollatek/sollatek.datasync
  RELEASE_ARCHIVE: sollatek-datasync-net10.tar.gz
  RELEASE_DOCKERFILE: Dockerfile.binary
  RELEASE_LICENSE: LICENCE.md
  RELEASE_MANIFEST: sollatek-datasync-release.json
  PUBLIC_RELEASE_EXCLUDED_TERMS_B64: ${{ secrets.PUBLIC_RELEASE_EXCLUDED_TERMS_B64 }}

jobs:
  validate:
    name: Validate source and release policy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate promotion path
        shell: pwsh
        run: |
          ./deployment/publication/Test-DataSyncReleasePromotion.ps1 `
            -EventName $env:GITHUB_EVENT_NAME `
            -RefType $env:GITHUB_REF_TYPE `
            -RefName $env:GITHUB_REF_NAME `
            -BaseRef $env:GITHUB_BASE_REF `
            -HeadRef $env:GITHUB_HEAD_REF `
            -CommitSha $env:GITHUB_SHA

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Verify public release exclusion gate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_RELEASE_EXCLUDED_TERMS_B64)) {
            throw "The public release exclusion list is not configured."
          }
          $trackedFiles = @(git ls-files)
          if ($LASTEXITCODE -ne 0 -or $trackedFiles.Count -eq 0) {
            throw "Could not enumerate the tracked source files."
          }
          ./deployment/publication/Test-PublicReleaseContent.ps1 `
            -ExcludedTextOnly `
            -ForbiddenTextBase64 $env:PUBLIC_RELEASE_EXCLUDED_TERMS_B64 `
            -Path $trackedFiles

      - name: Test solution
        run: dotnet test Sollatek.DataSync.sln -c Release --disable-build-servers -m:1 --verbosity minimal

  publish-release:
    name: Publish approved public release
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'branch' &&
      startsWith(github.ref, 'refs/heads/release/')
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: public-release
      url: https://github.com/${{ github.repository }}/releases
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release identity
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'branch' -or
              $env:GITHUB_REF_NAME -notmatch '^release/v(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)$') {
            throw "Publication requires a release/vMAJOR.MINOR.PATCH branch push."
          }

          $version = "$($Matches.major).$($Matches.minor).$($Matches.patch)"
          $releaseTag = "v$version"
          $majorMinor = "$($Matches.major).$($Matches.minor)"
          $major = $Matches.major

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "major_minor=$majorMinor" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "major=$major" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Build approved release bundle
        shell: pwsh
        run: ./deployment/publication/New-DataSyncReleaseBundle.ps1

      - name: Scan public release content
        shell: pwsh
        run: |
          ./deployment/publication/Test-PublicReleaseContent.ps1 `
            -ForbiddenTextBase64 $env:PUBLIC_RELEASE_EXCLUDED_TERMS_B64 `
            -Path @(
              '.artifacts/release/datasync',
              '.artifacts/release/self-contained',
              '.artifacts/release/Dockerfile.binary',
              '.artifacts/release/LICENCE.md',
              'deployment/publication/appsettings.public.json'
            )

      - name: Confirm version does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = '${{ steps.release.outputs.release_tag }}'
          $existingRelease = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
            --paginate `
            --jq ".[] | select(.tag_name == `"$releaseTag`") | .tag_name")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify whether release '$releaseTag' already exists."
          }
          if ($existingRelease.Count -gt 0) {
            throw "Release '$releaseTag' already exists and will not be overwritten."
          }

          $matchingRefsJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify whether tag '$releaseTag' already exists."
          }
          $existingTag = @(
            $matchingRefsJson |
              ConvertFrom-Json |
              Where-Object { $_.ref -eq "refs/tags/$releaseTag" }
          )
          if ($existingTag.Count -gt 0) {
            throw "Tag '$releaseTag' already exists and will not be moved or reused."
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .artifacts/release
          file: .artifacts/release/Dockerfile.binary
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.release.outputs.major_minor }}
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.release.outputs.major }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Publish versioned GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifactRoot = Join-Path $PWD '.artifacts/release'
          $archivePath = Join-Path $artifactRoot $env:RELEASE_ARCHIVE
          $dockerfilePath = Join-Path $artifactRoot $env:RELEASE_DOCKERFILE
          $licensePath = Join-Path $artifactRoot $env:RELEASE_LICENSE
          $manifestPath = Join-Path $artifactRoot $env:RELEASE_MANIFEST
          $checksumsPath = Join-Path $artifactRoot 'SHA256SUMS'
          $releaseTag = '${{ steps.release.outputs.release_tag }}'
          $releaseVersion = '${{ steps.release.outputs.version }}'
          $imageDigest = '${{ steps.image.outputs.digest }}'

          if ($imageDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "The published image digest is missing or invalid."
          }

          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $dockerfileHash = (Get-FileHash -LiteralPath $dockerfilePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $licenseHash = (Get-FileHash -LiteralPath $licensePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $executableDefinitions = @(
            [ordered]@{ rid = 'linux-x64'; name = 'sollatek-datasync-linux-x64.tar.gz'; entryPoint = 'Sollatek.DataSync'; archiveFormat = 'tar.gz' },
            [ordered]@{ rid = 'linux-arm64'; name = 'sollatek-datasync-linux-arm64.tar.gz'; entryPoint = 'Sollatek.DataSync'; archiveFormat = 'tar.gz' },
            [ordered]@{ rid = 'win-x64'; name = 'sollatek-datasync-win-x64.zip'; entryPoint = 'Sollatek.DataSync.exe'; archiveFormat = 'zip' },
            [ordered]@{ rid = 'win-arm64'; name = 'sollatek-datasync-win-arm64.zip'; entryPoint = 'Sollatek.DataSync.exe'; archiveFormat = 'zip' },
            [ordered]@{ rid = 'osx-x64'; name = 'sollatek-datasync-osx-x64.tar.gz'; entryPoint = 'Sollatek.DataSync'; archiveFormat = 'tar.gz' },
            [ordered]@{ rid = 'osx-arm64'; name = 'sollatek-datasync-osx-arm64.tar.gz'; entryPoint = 'Sollatek.DataSync'; archiveFormat = 'tar.gz' }
          )
          $executableArtifacts = @(
            foreach ($definition in $executableDefinitions) {
              $path = Join-Path $artifactRoot $definition.name
              [ordered]@{
                rid = $definition.rid
                name = $definition.name
                sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                framework = 'net10.0'
                deploymentMode = 'self-contained'
                entryPoint = $definition.entryPoint
                archiveFormat = $definition.archiveFormat
              }
            }
          )

          $manifest = [ordered]@{
            schemaVersion = 2
            contract = 'datasync-public-v2'
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            version = $releaseVersion
            release = $releaseTag
            image = [ordered]@{
              repository = $env:IMAGE_REPOSITORY
              tag = $releaseVersion
              immutableTag = "sha-$env:GITHUB_SHA"
              digest = $imageDigest
              platforms = @('linux/amd64', 'linux/arm64')
            }
            artifact = [ordered]@{
              name = $env:RELEASE_ARCHIVE
              sha256 = $archiveHash
              framework = 'net10.0'
              deploymentMode = 'framework-dependent'
              entryPoint = 'Sollatek.DataSync.dll'
            }
            executables = $executableArtifacts
            dockerfile = [ordered]@{
              name = $env:RELEASE_DOCKERFILE
              sha256 = $dockerfileHash
            }
            license = [ordered]@{
              name = $env:RELEASE_LICENSE
              sha256 = $licenseHash
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM

          $checksumLines = @(
            "$archiveHash  $env:RELEASE_ARCHIVE"
            "$dockerfileHash  $env:RELEASE_DOCKERFILE"
            "$licenseHash  $env:RELEASE_LICENSE"
            foreach ($executable in $executableArtifacts) {
              "$($executable.sha256)  $($executable.name)"
            }
            "$((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant())  $env:RELEASE_MANIFEST"
          )
          $checksumLines | Set-Content -LiteralPath $checksumsPath -Encoding utf8NoBOM

          ./deployment/publication/Test-PublicReleaseContent.ps1 `
            -ForbiddenTextBase64 $env:PUBLIC_RELEASE_EXCLUDED_TERMS_B64 `
            -Path @($manifestPath, $checksumsPath)

          $releaseFiles = @($archivePath, $dockerfilePath, $licensePath, $manifestPath, $checksumsPath) + @(
            $executableDefinitions | ForEach-Object { Join-Path $artifactRoot $_.name }
          )
          gh release create $releaseTag @releaseFiles `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --latest `
            --title "DataSync $releaseVersion" `
            --notes "DataSync $releaseVersion, built and tested from approved release commit $env:GITHUB_SHA. The container image supports Linux x64 and arm64. Self-contained downloads are provided for Linux, Windows, and macOS on x64 and arm64."
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with exit code $LASTEXITCODE."
          }
